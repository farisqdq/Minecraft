<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Phone Backups</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--ink:#0f172a;--muted:#64748b;--line:rgba(15,23,42,.1);--accent:#0f7a55;--on-accent:#fff;--bad:#b42318;--soft:rgba(15,122,85,.09)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--surface:#121821;--ink:#e6ebf2;--muted:#8b97a8;--line:rgba(230,235,242,.12);--accent:#3fbf8f;--on-accent:#06130d;--bad:#f0817a;--soft:rgba(63,191,143,.12)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.tab.on{background:var(--accent);color:var(--on-accent)}
select,input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.err{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px}
.tile{position:relative;aspect-ratio:1/1;background:var(--line);border:0;padding:0;cursor:pointer;overflow:hidden;border-radius:4px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.play{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;border-radius:20px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.row button{background:none;border:0;cursor:pointer;text-align:left;padding:0;font-weight:600}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.crumbs button{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.box{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center}
.box img,.box video{max-width:94vw;max-height:84vh;border-radius:8px}
.box .x{position:fixed;top:10px;right:16px;font-size:34px;color:#fff;background:none;border:0;cursor:pointer}
.box .nav{position:fixed;top:50%;transform:translateY(-50%);font-size:40px;color:#fff;background:rgba(0,0,0,.35);border:0;width:50px;height:70px;border-radius:8px;cursor:pointer}
.box .cap{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#ccc;font-size:13px}
.split{display:flex;gap:0;height:calc(100vh - 140px);min-height:400px}
.list{width:300px;flex:none;overflow:auto;border-right:1px solid var(--line)}
.conv{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px;cursor:pointer}
.conv.on{background:var(--soft)}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.thread{flex:1;display:flex;flex-direction:column;min-width:0}
.thead{padding:10px 14px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column-reverse}
.msgs>div{display:flex;flex-direction:column;gap:6px}
.m{display:flex;flex-direction:column}
.m.out{align-items:flex-end}.m.in{align-items:flex-start}
.b{max-width:76%;padding:8px 11px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.in .b{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.out .b{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.b img{max-width:240px;max-height:300px;border-radius:10px;display:block;margin:2px 0 6px;cursor:pointer}
.t{font-size:10.5px;opacity:.65;margin-top:3px;text-align:right}
.from{font-size:11.5px;color:var(--muted);margin:4px 0 2px 6px}
.back{display:none}
@media (max-width:700px){.list{width:100%;border:0}.split.open .list{display:none}.split:not(.open) .thread{display:none}.back{display:inline}}
.login{max-width:380px;margin:12vh auto}
.status{margin-bottom:14px}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--accent);transition:width .5s}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tile.sens img{filter:blur(22px);transform:scale(1.15)}
.tile .cover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:700;text-align:center}
.tile.sens .cover{display:flex}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";
var root = document.getElementById("root");
var S = { phones: [], phone: "", tab: "gallery" };

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function human(n){ if(!n) return "0 B"; var u=["B","KB","MB","GB","TB"],i=0; while(n>=1024&&i<u.length-1){n/=1024;i++;} return n.toFixed(i?1:0)+" "+u[i]; }
function when(ms){ if(!ms) return ""; return new Date(ms).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}); }
function fileUrl(p,opt){ return "/viewer/f/"+encodeURIComponent(S.phone)+"?p="+encodeURIComponent(p)+(opt||""); }
var IMG=/\.(jpe?g|png|gif|webp|bmp|avif)$/i, VID=/\.(mp4|mov|m4v|3gp|mkv|webm)$/i, HEIC=/\.(heic|heif)$/i;

async function api(path){
  var r = await fetch(path, {credentials:"same-origin", cache:"no-store"});
  if (r.status === 401) { showLogin(); throw new Error("signed out"); }
  var b = await r.json().catch(function(){return {};});
  if (!r.ok) throw new Error(b.error || ("Error "+r.status));
  return b;
}

// ---------- sign in ----------
function showLogin(msg){
  root.innerHTML = '<div class="card login"><h2 style="margin-top:0">Phone backups</h2>'+
    '<p class="muted">Sign in with the backup server password.</p>'+
    '<form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" style="width:100%" autofocus>'+
    '<div id="e" class="err" style="margin:8px 0">'+esc(msg||"")+'</div>'+
    '<button class="btn primary" style="width:100%">Sign in</button></form></div>';
  document.getElementById("f").onsubmit = async function(ev){
    ev.preventDefault();
    var e = document.getElementById("e"); e.textContent = "";
    var r = await fetch("/viewer/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("pw").value})});
    var b = await r.json().catch(function(){return {};});
    if (!r.ok) { e.textContent = b.error || "Couldn't sign in."; return; }
    start();
  };
}

// ---------- shell ----------
async function start(){
  root.innerHTML = '<main><p class="muted">Loading…</p></main>';
  var sum;
  try { sum = await api("/viewer/api/summary"); } catch(e){ if (e.message!=="signed out") root.innerHTML='<main><p class="err">'+esc(e.message)+'</p></main>'; return; }
  S.phones = (sum.devices||[]).filter(function(d){return d.paired;});
  S.disk = sum.disk;
  if (!S.phone && S.phones[0]) S.phone = S.phones[0].id;
  shell();
}

function shell(){
  var tabs = [["gallery","Photos & videos"],["texts","Texts"],["files","Files"],["phones","Phones"]];
  root.innerHTML =
    '<header><h1>Phone backups</h1><nav>'+
      tabs.map(function(t){return '<button class="tab'+(S.tab===t[0]?" on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>';}).join("")+
    '</nav>'+
    (S.phones.length? '<select id="ph">'+S.phones.map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===S.phone?" selected":"")+'>'+esc(p.name)+'</option>';}).join("")+'</select>' : '')+
    '<button class="btn" id="out">Sign out</button></header><main><div id="status"></div><div id="main"></div></main>';
  root.querySelectorAll(".tab").forEach(function(b){ b.onclick=function(){ S.tab=b.dataset.t; shell(); }; });
  var ph = document.getElementById("ph"); if (ph) ph.onchange = function(){ S.phone = ph.value; shell(); };
  document.getElementById("out").onclick = async function(){ await fetch("/viewer/logout",{method:"POST"}); showLogin(); };
  drawStatus();
  var main = document.getElementById("main");
  if (!S.phones.length && S.tab!=="phones") { main.innerHTML = '<div class="card muted">No set-up phones yet.</div>'; return; }
  ({gallery:gallery, texts:texts, files:files, phones:phones})[S.tab](main);
}

// ---------- live backup status (top of every tab) ----------
function fmtLeft(sec){
  if (sec==null || !isFinite(sec) || sec<0) return "";
  if (sec<60) return "under a minute left";
  var m=Math.round(sec/60); if (m<90) return "about "+m+" min left";
  var h=Math.floor(m/60), mm=m%60; return "about "+h+" hr"+(mm?" "+mm+" min":"")+" left";
}
function drawStatus(){
  var el = document.getElementById("status"); if (!el) return;
  var p = S.phones.filter(function(x){return x.id===S.phone;})[0];
  if (!p) { el.innerHTML=""; return; }
  var r = p.report || {}, now = Date.now();
  var live = r.running && r.at && now - r.at < 3*60*1000;
  if (live) {
    var since = Math.max(0,(now-r.at)/1000);
    var pct = r.bytesTotal ? Math.min(100,Math.round((r.bytesDone||0)/r.bytesTotal*100)) : (r.total? Math.round((r.done||0)/r.total*100):0);
    var eta = r.etaSec!=null ? fmtLeft(r.etaSec - since) : "working out time left…";
    el.innerHTML = '<div class="card status"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>'+esc(p.name)+' — backing up now, '+pct+'%</b><span class="muted">'+esc(eta)+'</span></div>'+
      '<div class="bar"><div style="width:'+pct+'%"></div></div>'+
      '<div class="muted" style="margin-top:6px;font-size:13px">'+(r.done||0)+' of '+(r.total||0)+' files · '+human(r.bytesDone)+' of '+human(r.bytesTotal)+' · updated '+(since<5?"just now":Math.round(since)+" s ago")+'</div></div>';
  } else {
    var last = r.error ? '<span class="err">Last backup: '+esc(r.error)+'</span>'
      : r.at ? 'Last backup '+when(r.at)+(r.sentFiles!=null? ' · sent '+r.sentFiles+' new files ('+human(r.sentBytes)+')':'') : 'No backup yet';
    el.innerHTML = '<div class="card status" style="padding:12px 16px"><b>'+esc(p.name)+'</b> · '+human(p.bytes)+' backed up · '+(p.files||0)+' files<div class="muted" style="font-size:13px">'+last+'</div></div>';
  }
}
setInterval(drawStatus, 1000);
setInterval(async function(){
  try {
    var sum = await fetch("/viewer/api/summary",{credentials:"same-origin",cache:"no-store"}).then(function(r){return r.ok?r.json():null;});
    if (sum && sum.devices) { S.phones = sum.devices.filter(function(d){return d.paired;}); S.disk = sum.disk; }
  } catch(e){}
}, 10000);

// ---------- phones ----------
function phones(main){
  var d = S.disk;
  main.innerHTML = (d? '<div class="card"><b>Server disk</b><div class="muted">'+human(d.free)+' free of '+human(d.total)+'</div></div>' : '')+
    S.phones.map(function(p){
      var r = p.report||{};
      var status = r.running ? "Backing up now — "+(r.done||0)+" of "+(r.total||0)+" files" : (r.error? "Last backup: "+r.error : (r.at? "Last backup "+when(r.at) : ""));
      return '<div class="card"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.model||"")+' · '+human(p.bytes)+' backed up · '+(p.files||0)+' files'+(p.appVersion?' · app v'+esc(p.appVersion):'')+'</div>'+
        (p.lastSeen? '<div class="muted">Last seen '+when(Date.parse(p.lastSeen))+'</div>':'')+
        (status? '<div style="margin-top:6px">'+esc(status)+'</div>':'')+
        (p.loc? '<div style="margin-top:6px">📍 <a target="_blank" rel="noreferrer" href="https://www.google.com/maps?q='+p.loc.lat+','+p.loc.lng+'">Last location</a> · '+when(Date.parse(p.loc.at))+'</div>':'')+
      '</div>';
    }).join("");
}

// ---------- gallery ----------
var galleryCache = {};
async function gallery(main){
  main.innerHTML = '<p class="muted" id="gs">Finding photos…</p><div class="grid" id="g"></div>';
  var items = galleryCache[S.phone];
  if (!items) {
    items = []; var queue = ["Photos"], folders = 0;
    try {
      while (queue.length && folders < 500 && items.length < 20000) {
        var dir = queue.shift(); folders++;
        var res = await api("/viewer/api/devices/"+encodeURIComponent(S.phone)+"/list?dir="+encodeURIComponent(dir));
        (res.entries||[]).forEach(function(e){
          if (e.dir) queue.push(e.path);
          else if (IMG.test(e.name)||VID.test(e.name)||HEIC.test(e.name)) items.push(e);
        });
        var gs = document.getElementById("gs"); if (gs) gs.textContent = "Finding photos… "+items.length;
      }
    } catch(e){ var gs2=document.getElementById("gs"); if(gs2) gs2.innerHTML='<span class="err">'+esc(e.message)+'</span>'; return; }
    items.sort(function(a,b){ return a.mtime < b.mtime ? 1 : -1; });
    galleryCache[S.phone] = items;
  }
  var gs3 = document.getElementById("gs"); if (!gs3) return;
  gs3.outerHTML = '<div class="tools"><span class="muted" id="gs">'+items.length+' photos &amp; videos</span>'+
    '<select id="flt"><option value="all">All</option><option value="sens">Sensitive only</option><option value="hide">Hide sensitive</option></select>'+
    '<select id="srt"><option value="new">Newest first</option><option value="sens">Sensitive first</option></select>'+
    '<span class="muted" id="scan" style="font-size:13px"></span></div>';
  var flt = document.getElementById("flt"), srt = document.getElementById("srt");
  flt.value = S.flt || "all"; srt.value = S.srt || "new";
  var g = document.getElementById("g"), view = [], shown = 0;
  var phone = S.phone;
  function v(e){ return verdictOf(phone, e.path); }
  function rebuild(){
    S.flt = flt.value; S.srt = srt.value;
    view = items.filter(function(e){ var x=v(e); return S.flt==="sens" ? x===1 : S.flt==="hide" ? x!==1 : true; });
    if (S.srt==="sens") view = view.slice().sort(function(a,b){ return (v(b)===1)-(v(a)===1) || (a.mtime<b.mtime?1:-1); });
    g.innerHTML = ""; shown = 0; more();
    if (!view.length) g.innerHTML = '<p class="muted">'+(S.flt==="sens" ? "Nothing flagged as sensitive"+(scanState.left? " yet — still checking." : ".") : "Nothing to show.")+'</p>';
  }
  function more(){
    var frag = document.createDocumentFragment();
    view.slice(shown, shown+240).forEach(function(e, k){
      var i = shown + k;
      var b = document.createElement("button"); b.className="tile"+(v(e)===1?" sens":""); b.title=e.name; b.dataset.p=e.path;
      if (VID.test(e.name)) b.innerHTML = '<div class="ph">▶ video</div><span class="play">▶</span>';
      else b.innerHTML = '<img loading="lazy" alt="" src="'+fileUrl(e.path,"&thumb=1")+'"><div class="cover"><span style="font-size:16px">⚠</span>Sensitive<span style="font-weight:400">tap to view</span></div>';
      b.onclick = function(){ if (b.classList.contains("sens")) { b.classList.remove("sens"); return; } lightbox(view, i); };
      frag.appendChild(b);
    });
    shown += 240; g.appendChild(frag);
  }
  flt.onchange = rebuild; srt.onchange = rebuild;
  rebuild();
  var sentinel = document.createElement("div"); main.appendChild(sentinel);
  new IntersectionObserver(function(es){ if (es[0].isIntersecting && shown < view.length) more(); }, {rootMargin:"800px"}).observe(sentinel);
  startScan(phone, items, function(path, sensitive, done){
    if (sensitive) { var t = g.querySelector('[data-p="'+CSS.escape(path)+'"]'); if (t) t.classList.add("sens"); }
    var sc = document.getElementById("scan");
    if (sc) sc.textContent = scanState.left ? "Checking for sensitive photos… "+scanState.done+" of "+scanState.total+" · "+scanState.flagged+" flagged"
                                            : scanState.flagged+" sensitive found";
    if (done && S.flt!=="all") rebuild();
  });
}

// ---------- sensitive-photo check (runs in this browser, on thumbnails) ----------
var NS_KEY = "rrv-nsfw-v2", nsMap = null;
function nsLoad(){ if (nsMap) return nsMap; try { nsMap = JSON.parse(localStorage.getItem(NS_KEY)||"{}"); } catch(e){ nsMap = {}; } return nsMap; }
var nsSaveT = null;
function nsSave(){ if (nsSaveT) return; nsSaveT = setTimeout(function(){ nsSaveT=null; try { localStorage.setItem(NS_KEY, JSON.stringify(nsMap)); } catch(e){} }, 1500); }
// 1 = flagged, 0 = fine, 2 = you marked it "not sensitive" (never re-flagged).
function verdictOf(phone, path){ var x = nsLoad()[phone+"|"+path]; return x===1?1:(x===0||x===2)?0:-1; }
function clearFlag(phone, path){ nsLoad()[phone+"|"+path] = 2; nsSave(); scanState.flagged = Math.max(0, scanState.flagged-1); }
var scanState = { run: 0, done: 0, total: 0, left: 0, flagged: 0 };
var modelP = null;
function getModel(){
  if (!modelP) modelP = new Promise(function(res, rej){
    if (window.RRNSFW) return res(window.RRNSFW.load());
    var s = document.createElement("script"); s.src = "/viewer/nsfw.js";
    s.onload = function(){ res(window.RRNSFW.load()); }; s.onerror = function(){ modelP = null; rej(new Error("detector didn't load")); };
    document.head.appendChild(s);
  });
  return modelP;
}
function loadImg(src){ return new Promise(function(res, rej){ var im = new Image(); im.onload=function(){res(im);}; im.onerror=rej; im.src=src; }); }
async function startScan(phone, items, onUpdate){
  var run = ++scanState.run;
  var m = nsLoad();
  var todo = items.filter(function(e){ return !VID.test(e.name) && m[phone+"|"+e.path]==null; });
  scanState.total = items.filter(function(e){ return !VID.test(e.name); }).length;
  scanState.flagged = items.filter(function(e){ return m[phone+"|"+e.path]===1; }).length;
  scanState.done = scanState.total - todo.length; scanState.left = todo.length;
  onUpdate(null, false, !todo.length);
  if (!todo.length) return;
  var model;
  try { model = await getModel(); } catch(e){ var sc=document.getElementById("scan"); if(sc) sc.textContent="Couldn't start the sensitive-photo check."; return; }
  var c = document.createElement("canvas"); c.width = c.height = 224; var ctx = c.getContext("2d");
  var i = 0, pending = [];
  function fetchNext(){ while (pending.length < 3 && i < todo.length) { var e = todo[i++]; pending.push({e:e, p: loadImg(fileUrl(e.path,"&thumb=1")).catch(function(){ return null; })}); } }
  fetchNext();
  while (pending.length) {
    if (run !== scanState.run || S.phone !== phone) return; // left the gallery or switched phone
    var job = pending.shift(); fetchNext();
    var img = await job.p, sens = null;
    if (img) {
      try {
        var sw=img.naturalWidth||img.width, sh=img.naturalHeight||img.height, sq=Math.min(sw,sh);
        ctx.drawImage(img, (sw-sq)/2, (sh-sq)/2, sq, sq, 0, 0, 224, 224);
        var preds = await model.classify(c, 5), pr = function(n){ var x=preds.filter(function(q){return q.className===n;})[0]; return x?x.probability:0; };
        // Only confident "explicit" verdicts; "suggestive" alone flags ordinary photos of people.
        sens = Math.max(pr("Porn"), pr("Hentai")) >= 0.8 || pr("Porn") + pr("Hentai") >= 0.9;
      } catch(e){}
    }
    if (sens !== null) { m[phone+"|"+job.e.path] = sens?1:0; nsSave(); if (sens) scanState.flagged++; }
    scanState.done++; scanState.left--;
    onUpdate(job.e.path, sens===true, scanState.left===0);
  }
}

function lightbox(items, i){
  var box = document.createElement("div"); box.className="box";
  function draw(){
    var e = items[i];
    var media = VID.test(e.name) ? '<video src="'+fileUrl(e.path)+'" controls autoplay playsinline></video>'
      : HEIC.test(e.name) ? '<img src="'+fileUrl(e.path,"&thumb=1&w=1600")+'" alt="">'
      : '<img src="'+fileUrl(e.path)+'" alt="">';
    box.innerHTML = '<button class="x" aria-label="Close">×</button>'+
      '<button class="nav" style="left:10px" data-d="-1">‹</button><button class="nav" style="right:10px" data-d="1">›</button>'+
      media+'<div class="cap">'+(i+1)+' of '+items.length+' · '+esc(e.name)+' · <a href="'+fileUrl(e.path,"&a=1")+'">Download</a>'+
      (verdictOf(S.phone, e.path)===1 ? ' · <a href="#" id="nsok">Not sensitive</a>' : '')+'</div>';
    box.querySelector(".x").onclick = close;
    var ok = box.querySelector("#nsok");
    if (ok) ok.onclick = function(ev){ ev.preventDefault(); clearFlag(S.phone, e.path);
      var t = document.querySelector('.tile[data-p="'+CSS.escape(e.path)+'"]'); if (t) t.classList.remove("sens"); draw(); };
    box.querySelectorAll(".nav").forEach(function(n){ n.onclick=function(ev){ ev.stopPropagation(); i=(i+Number(n.dataset.d)+items.length)%items.length; draw(); }; });
  }
  function close(){ box.remove(); document.removeEventListener("keydown", key); }
  function key(ev){ if(ev.key==="Escape") close(); else if(ev.key==="ArrowLeft"){i=(i-1+items.length)%items.length;draw();} else if(ev.key==="ArrowRight"){i=(i+1)%items.length;draw();} }
  box.onclick = function(ev){ if (ev.target===box) close(); };
  document.addEventListener("keydown", key);
  document.body.appendChild(box); draw();
}

// ---------- files ----------
async function files(main, dir){
  dir = dir || "";
  main.innerHTML = '<p class="muted">Loading…</p>';
  var res;
  try { res = await api("/viewer/api/devices/"+encodeURIComponent(S.phone)+"/list?dir="+encodeURIComponent(dir)); }
  catch(e){ main.innerHTML='<p class="err">'+esc(e.message)+'</p>'; return; }
  var cur = res.dir==="." ? "" : res.dir;
  var parts = cur ? cur.split("/") : [];
  var html = '<div class="card"><div class="crumbs"><button data-d="">All</button>'+
    parts.map(function(p,k){ return '<span class="muted">/</span><button data-d="'+esc(parts.slice(0,k+1).join("/"))+'">'+esc(p)+'</button>'; }).join("")+'</div>';
  var es = res.entries||[];
  es.sort(function(a,b){ return (a.dir===b.dir) ? (a.name<b.name?-1:1) : (a.dir?-1:1); });
  if (!es.length) html += '<p class="muted">This folder is empty.</p>';
  html += es.map(function(e){
    return e.dir
      ? '<div class="row"><button data-d="'+esc(e.path)+'">📁 '+esc(e.name)+'</button><span class="muted">'+(e.count||0)+' items</span></div>'
      : '<div class="row"><span>📄 '+esc(e.name)+'</span><span><span class="muted">'+human(e.size)+'</span> · <a href="'+fileUrl(e.path,"&a=1")+'">Download</a></span></div>';
  }).join("")+'</div>';
  main.innerHTML = html;
  main.querySelectorAll("[data-d]").forEach(function(b){ b.onclick=function(){ files(main, b.dataset.d); }; });
}

// ---------- texts ----------
function norm(a){ var d=(a||"").replace(/\D/g,""); return d.length>=10 ? d.slice(-10) : (d||a||""); }
function parseTexts(xml){
  var doc = new DOMParser().parseFromString(xml, "application/xml");
  var byKey = {};
  function convo(key,name,address){
    var c = byKey[key] || (byKey[key] = {key:key,name:name||address,address:address,last:0,msgs:[]});
    if (c.name===c.address && name && name!=="(Unknown)") c.name = name;
    return c;
  }
  Array.prototype.forEach.call(doc.getElementsByTagName("sms"), function(el){
    var a = el.getAttribute("address")||"(Unknown)", n = el.getAttribute("contact_name");
    var c = convo(norm(a), n && n!=="(Unknown)" ? n : a, a);
    var t = Number(el.getAttribute("date"))||0;
    c.msgs.push({out: el.getAttribute("type")==="2", body: el.getAttribute("body")||"", t:t}); if (t>c.last) c.last=t;
  });
  var mms = Array.prototype.slice.call(doc.getElementsByTagName("mms"));
  var tally = {}, self = "", best = 0;
  mms.forEach(function(m){ if (m.getAttribute("msg_box")!=="1") return;
    Array.prototype.forEach.call(m.getElementsByTagName("addr"), function(a){ if(a.getAttribute("type")==="151"){ var k=norm(a.getAttribute("address")); tally[k]=(tally[k]||0)+1; if(tally[k]>best){best=tally[k];self=k;} } }); });
  mms.forEach(function(m){
    var out = m.getAttribute("msg_box")==="2", t = Number(m.getAttribute("date"))||0, people = {}, from = null;
    Array.prototype.forEach.call(m.getElementsByTagName("addr"), function(a){
      var k = norm(a.getAttribute("address")); var info = {address:a.getAttribute("address"), name:a.getAttribute("name")};
      if (a.getAttribute("type")==="137") from = info;
      if (!k || k===self || (out && a.getAttribute("type")==="137")) return;
      people[k] = people[k] || info;
    });
    var keys = Object.keys(people).sort(); if (!keys.length) return;
    var label = function(p){ return p.name && p.name!=="(Unknown)" ? p.name : p.address; };
    var c = convo(keys.join(","), keys.map(function(k){return label(people[k]);}).join(", "), keys.map(function(k){return people[k].address;}).join(", "));
    var body = "", att = [];
    Array.prototype.forEach.call(m.getElementsByTagName("part"), function(p){
      if (p.getAttribute("text")) body += (body?"\n":"") + p.getAttribute("text");
      if (p.getAttribute("src")) att.push({path:"Texts/"+p.getAttribute("src"), ct:p.getAttribute("ct")||""});
    });
    c.msgs.push({out:out, body:body, t:t, att:att, from: (!out && keys.length>1 && from) ? label(from) : ""}); if (t>c.last) c.last=t;
  });
  var list = Object.keys(byKey).map(function(k){ var c=byKey[k]; c.msgs.sort(function(a,b){return a.t-b.t;}); return c; });
  list.sort(function(a,b){ return b.last-a.last; });
  return list;
}

var textsCache = {};
async function texts(main){
  main.innerHTML = '<p class="muted">Loading texts…</p>';
  var convos = textsCache[S.phone];
  if (!convos) {
    try {
      var res = await api("/viewer/api/devices/"+encodeURIComponent(S.phone)+"/list?dir=Texts");
      var xmls = (res.entries||[]).filter(function(e){ return !e.dir && /\.xml$/i.test(e.name); });
      if (!xmls.length) { main.innerHTML = '<div class="card muted">No texts backed up yet.</div>'; return; }
      xmls.sort(function(a,b){ return a.mtime < b.mtime ? 1 : -1; });
      var r = await fetch(fileUrl(xmls[0].path), {credentials:"same-origin"});
      if (!r.ok) throw new Error("Couldn't open the texts file ("+r.status+").");
      convos = parseTexts(await r.text());
      textsCache[S.phone] = convos;
    } catch(e){ if (e.message!=="signed out") main.innerHTML='<p class="err">'+esc(e.message)+'</p>'; return; }
  }
  main.innerHTML = '<div class="card" style="padding:0;overflow:hidden"><div class="split" id="sp">'+
    '<div class="list"><input id="q" placeholder="Search people…" style="margin:10px;width:calc(100% - 20px)"><div id="cl"></div></div>'+
    '<div class="thread" id="th"><div class="muted" style="padding:20px">Pick a conversation.</div></div></div></div>';
  var cl = document.getElementById("cl"), q = document.getElementById("q");
  function drawList(){
    var f = q.value.toLowerCase();
    cl.innerHTML = convos.filter(function(c){ return !f || c.name.toLowerCase().indexOf(f)>=0 || c.address.indexOf(f)>=0; }).slice(0,1500).map(function(c){
      return '<button class="conv" data-k="'+esc(c.key)+'"><div class="av">'+esc((c.name||"?").slice(0,1).toUpperCase())+'</div><div style="min-width:0"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c.name)+'</div><div class="muted" style="font-size:12.5px">'+c.msgs.length+' messages · '+when(c.last)+'</div></div></button>';
    }).join("");
    cl.querySelectorAll(".conv").forEach(function(b){ b.onclick=function(){ openConvo(b.dataset.k); }; });
  }
  function openConvo(k){
    var c = convos.filter(function(x){return x.key===k;})[0]; if (!c) return;
    document.getElementById("sp").classList.add("open");
    cl.querySelectorAll(".conv").forEach(function(b){ b.classList.toggle("on", b.dataset.k===k); });
    var th = document.getElementById("th");
    th.innerHTML = '<div class="thead"><button class="btn back" id="bk">‹ All</button> <b>'+esc(c.name)+'</b> <span class="muted">'+esc(c.address)+'</span></div>'+
      '<div class="msgs"><div>'+c.msgs.slice(-3000).map(function(m){
        var att = (m.att||[]).map(function(a){
          var ct = a.ct.toLowerCase();
          if (ct.indexOf("image/")===0) return '<a href="'+fileUrl(a.path)+'" target="_blank" rel="noreferrer"><img loading="lazy" src="'+fileUrl(a.path,"&thumb=1")+'" alt=""></a>';
          if (ct.indexOf("video/")===0) return '<video src="'+fileUrl(a.path)+'" controls preload="none" style="max-width:240px;border-radius:10px"></video>';
          if (ct.indexOf("audio/")===0) return '<audio src="'+fileUrl(a.path)+'" controls preload="none"></audio>';
          return '<a href="'+fileUrl(a.path,"&a=1")+'">📎 Attachment</a>';
        }).join("");
        return '<div class="m '+(m.out?"out":"in")+'">'+(m.from?'<div class="from">'+esc(m.from)+'</div>':'')+
          '<div class="b">'+att+(m.body?esc(m.body):(att?'':'<em style="opacity:.6">(no text)</em>'))+'<div class="t">'+when(m.t)+'</div></div></div>';
      }).join("")+'</div></div>';
    document.getElementById("bk").onclick = function(){ document.getElementById("sp").classList.remove("open"); };
  }
  q.oninput = drawList; drawList();
}

start();
})();
